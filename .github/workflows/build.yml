name: Build DuckMC

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build plugin
        run: mvn -B package
      - name: Zip resource pack
        run: |
          cd resourcepack
          zip -r ../DuckMC-Pack.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: DuckMC-plugin
          path: target/DuckMC.jar
      - uses: actions/upload-artifact@v4
        with:
          name: DuckMC-Pack
          path: DuckMC-Pack.zip
